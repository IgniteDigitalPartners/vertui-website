<!doctype html>
<html>
<head><meta charset="utf-8"><title>SignupForm — preview</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Manrope:wght@300;400&display=swap">
<style>body{margin:0;padding:20px;background:var(--white)}</style></head>
<body class="vt">
<form class="vt-signup" onsubmit="event.preventDefault()">
  <h2 class="vt-title">Join Our Mailing List</h2>
  <label for="email" hidden>Email</label><input class="vt-field" id="email" type="email" placeholder="Email">
  <label for="postal" hidden>Postal Code</label><input class="vt-field" id="postal" placeholder="Postal Code">
  <button class="vt-submit" type="submit">Subscribe</button>
  <p class="vt-fine">By providing your email address, you agree to receive tips, product updates, special offers, and other relevant information from Vertui Horticulture.</p>
</form>
</body>
</html>
